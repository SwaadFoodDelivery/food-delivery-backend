services:
  postgres:
    image: postgis/postgis:15-3.4
    platform: ${POSTGRES_PLATFORM:-linux/amd64}
    container_name: food-delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_delivery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: food-delivery-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2-alpine
    container_name: food-delivery-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: food-delivery-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    container_name: food-delivery-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/food-delivery-local &&
      mc mb --ignore-existing local/food-delivery-onboarding &&
      mc anonymous set none local/food-delivery-local &&
      mc anonymous set none local/food-delivery-onboarding
      "

  migration-guard:
    image: postgres:15-alpine
    container_name: food-delivery-migration-guard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        MAX_FILE_VERSION=$$(ls /migrations/*.up.sql | sed -E 's#.*/([0-9]+)_.*#\1#' | sort -n | tail -1)
        HAS_SCHEMA_MIGRATIONS=$$(psql -h postgres -U postgres -d food_delivery -tA -c "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='schema_migrations');")
        if [ "$$HAS_SCHEMA_MIGRATIONS" = "t" ]; then
          VERSION=$$(psql -h postgres -U postgres -d food_delivery -tA -c "SELECT version FROM schema_migrations LIMIT 1;")
          DIRTY=$$(psql -h postgres -U postgres -d food_delivery -tA -c "SELECT dirty FROM schema_migrations LIMIT 1;")
          [ -n "$$VERSION" ] || VERSION=0
          [ -n "$$DIRTY" ] || DIRTY=f

          if [ "$$DIRTY" = "t" ]; then
            echo "migration-guard: schema_migrations is dirty=true; refusing startup"
            exit 1
          fi

          if [ "$$VERSION" -gt "$$MAX_FILE_VERSION" ]; then
            echo "migration-guard: DB version=$$VERSION but max migration file=$$MAX_FILE_VERSION"
            exit 1
          fi

          i=1
          while [ "$$i" -le "$$VERSION" ]; do
            if ! ls /migrations/$$(printf "%06d" "$$i")_*.up.sql >/dev/null 2>&1; then
              echo "migration-guard: missing migration file for version $$i"
              exit 1
            fi
            i=$$((i+1))
          done
        fi
        echo "migration-guard: migration state looks consistent"

  food-delivery-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-delivery-backend
    restart: unless-stopped
    depends_on:
      migration-guard:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_NAME: food-delivery-backend
      APP_ENV: development
      APP_PORT: "8080"
      LOG_LEVEL: debug

      # Postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_delivery
      POSTGRES_SSLMODE: disable

      # Redis
      REDIS_ADDR: redis:6379

      # NATS
      NATS_URL: nats://nats:4222
      NATS_CLIENT_ID: food-delivery-backend

      # Auth
      JWT_SECRET: dev-secret-change-me-in-prod
      EMAIL_PROVIDER: mock
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_ENDPOINT: ${SENDGRID_ENDPOINT:-https://api.sendgrid.com/v3/mail/send}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Food Delivery}
      S3_PROVIDER: dev
      S3_BUCKET: food-delivery-local
      S3_BUCKETS: default:food-delivery-local,onboarding:food-delivery-onboarding
      S3_DEFAULT_BUCKET: food-delivery-local
      S3_ONBOARDING_BUCKET: food-delivery-onboarding
      S3_REGION: ap-south-1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PRESIGN_TTL_SECONDS: "300"

      # gRPC (order service running on your host machine during local dev)
      ORDER_GRPC_ADDR: host.docker.internal:50051
      ORDER_GRPC_REQUIRED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
