services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_delivery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

  migration-guard:
    image: postgres:15-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        MAX_FILE_VERSION=$$(ls /migrations/*.up.sql | sed -E 's#.*/([0-9]+)_.*#\1#' | sort -n | tail -1)
        HAS_SCHEMA_MIGRATIONS=$$(psql -h postgres -U postgres -d food_delivery -tA -c "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='schema_migrations');")
        if [ "$$HAS_SCHEMA_MIGRATIONS" = "t" ]; then
          VERSION=$$(psql -h postgres -U postgres -d food_delivery -tA -c "SELECT version FROM schema_migrations LIMIT 1;")
          DIRTY=$$(psql -h postgres -U postgres -d food_delivery -tA -c "SELECT dirty FROM schema_migrations LIMIT 1;")
          [ -n "$$VERSION" ] || VERSION=0
          [ -n "$$DIRTY" ] || DIRTY=f

          if [ "$$DIRTY" = "t" ]; then
            echo "migration-guard: schema_migrations is dirty=true; refusing startup"
            exit 1
          fi

          if [ "$$VERSION" -gt "$$MAX_FILE_VERSION" ]; then
            echo "migration-guard: DB version=$$VERSION but max migration file=$$MAX_FILE_VERSION"
            exit 1
          fi

          i=1
          while [ "$$i" -le "$$VERSION" ]; do
            if ! ls /migrations/$$(printf "%06d" "$$i")_*.up.sql >/dev/null 2>&1; then
              echo "migration-guard: missing migration file for version $$i"
              exit 1
            fi
            i=$$((i+1))
          done
        fi
        echo "migration-guard: migration state looks consistent"

  food-delivery-backend:
    build:
      context: .
    depends_on:
      migration-guard:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      APP_NAME: food-delivery-backend
      APP_ENV: development
      APP_PORT: "8080"
      LOG_LEVEL: debug
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_delivery
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: food-delivery-backend
      KAFKA_REQUIRED_ACKS: "1"
      KAFKA_BATCH_SIZE: "1"
      KAFKA_ORDER_EVENTS_TOPIC: order-events
      JWT_SECRET: dev-secret
      ORDER_GRPC_ADDR: host.docker.internal:50051
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
