name: CI

on:
  pull_request:
    branches:
      - main
      - codex/vert-001-catalog
      - codex/serviceability-policy
      - codex/payment-delivery-gate
      - codex/onboarding-serialization
      - codex/persist-order-history
      - codex/operations-query-repair
      - codex/mock-otp-outbox
    paths-ignore:
      - "**/.env"
      - "**/.env.*"
  push:
    branches:
      - main
    paths-ignore:
      - "**/.env"
      - "**/.env.*"

permissions:
  contents: read

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "These files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -race ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: go-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Build
        run: docker build -t food-delivery-backend:ci .

  migration-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: food_delivery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d food_delivery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run migration, onboarding and PostGIS serviceability integration tests
        env:
          SERVICEABILITY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_delivery?sslmode=disable
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_delivery?sslmode=disable
          ONBOARDING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_delivery?sslmode=disable
          PAYMENT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_delivery?sslmode=disable
        run: |
          go test -race ./infra/postgres -run 'TestMigrationsAndDemoSeed|TestOnboardingApprovalMigration28|TestStatusHistoryMigration29' -count=1 -v
          go test -race ./internal/services/users/business -run TestOnboardingIntegration -count=1 -v
          go test -race ./internal/services/order/repository -run TestServiceabilityPostGIS -count=1 -v
          go test -race ./internal/services/delivery/repository -run TestPaymentDeliveryGatePostgres -count=1 -v

  paired-order-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swaad_grpc_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swaad_grpc_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout tested order-service implementation
        uses: actions/checkout@v4
        with:
          repository: SwaadFoodDelivery/order-service
          ref: 05f99a6e74aaee5b3f955ddd7d5571a65cce99d5
          path: .integration-order-service
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply authoritative schema and fixture catalog
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/swaad_grpc_test_ci?sslmode=disable
        run: go test ./infra/postgres -run '^TestMigrationsAndDemoSeed$' -count=1 -v
      - name: Provision SELECT-only service role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d swaad_grpc_test_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE swaad_rpc_reader LOGIN PASSWORD 'fictional-local-reader-only-ci' NOSUPERUSER NOCREATEDB NOCREATEROLE; GRANT USAGE ON SCHEMA public TO swaad_rpc_reader; GRANT SELECT ON orders,order_items,payments TO swaad_rpc_reader;"
      - name: Build real order-service binary
        working-directory: .integration-order-service
        run: go build -o /tmp/swaad-order-rpc-ci ./cmd/server
      - name: HTTP to actual gRPC service to PostGIS acceptance
        env:
          APP_ENV: test
          ORDER_GRPC_ADDR: 127.0.0.1:15051
          ORDER_GRPC_SERVICE_KEY: fictional-local-service-key-1234567890
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_USER: swaad_rpc_reader
          POSTGRES_PASSWORD: fictional-local-reader-only-ci
          POSTGRES_DB: swaad_grpc_test_ci
          POSTGRES_SSLMODE: disable
          ORDER_RPC_E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/swaad_grpc_test_ci?sslmode=disable
          ORDER_RPC_E2E_ADDR: 127.0.0.1:15051
          ORDER_RPC_E2E_KEY: fictional-local-service-key-1234567890
        run: |
          /tmp/swaad-order-rpc-ci >/tmp/swaad-order-rpc-ci.log 2>&1 &
          order_rpc_pid=$!
          trap 'kill "$order_rpc_pid" 2>/dev/null || true; wait "$order_rpc_pid" 2>/dev/null || true' EXIT
          go test -race ./internal/services/order/api -run TestPairedOrderServicePostgres -count=1 -v
